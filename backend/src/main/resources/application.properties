spring.application.name=stress-monitoring

# Server config
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sih26094_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# CRITICAL: We do NOT generate schemas! The SQL file provided in the repo is authoritative.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false


# JWT Settings
jwt.secret=${JWT_SECRET:sih26094supersecretjwtkeythisshouldbelongandrandomforthehackathon}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ML scoring service (FastAPI ai-service)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://ai-based-stress-monitoring-system-f-eta.vercel.app}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

