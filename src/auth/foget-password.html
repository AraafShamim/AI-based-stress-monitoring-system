<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मनSetu | Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Arya:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-container forgot-page">
        <h1><span class="hindi">मन</span><span class="english">Setu</span></h1>
        <p class="tagline">Your wellbeing, our bridge.</p>
        <img src="../assets/logo1.png" class="logo" alt="MannSetu Logo">

        <h2><span class="english">Forgot Password?</span></h2>
        <p class="subtitle">Enter your registered phone number or email id.</p>

        <form id="forgotPasswordForm">
            <div class="input-box">
                <span><i class="fa-solid fa-user"></i></span>
                <input type="text" id="recoveryContact" placeholder="Phone number or email" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>

        <p class="signup">
            Remember your password?
            <a href="login.html">Back to login</a>
        </p>
    </div>

    <script src="forget-password.js"></script>
</body>
</html>
