<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>मनSetu | Login</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Arya:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Dancing+Script:wght@600&family=Poppins:ital,wght@1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

   <div class="top-right-actions">

    <!-- Hamburger Menu -->
    <div class="menu-wrapper">
        <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="dropdown-menu" id="menuDropdown">
            <a href="user-login.html">
                <i class="fa-solid fa-user"></i>
                User Login
            </a>

            <a href="counsellor-login.html">
                <i class="fa-solid fa-user-doctor"></i>
                Counsellor Login
            </a>

            <a href="admin-login.html">
                <i class="fa-solid fa-user-shield"></i>
                Admin Login
            </a>
        </div>
    </div>


    <!-- Language -->
    <div class="language-wrapper">
        <button class="icon-btn" id="languageBtn" aria-label="Language">
            <i class="fa-solid fa-globe"></i>
        </button>

        <div class="dropdown-menu language-dropdown" id="languageDropdown">
            <button>English</button>
            <button>हिन्दी</button>
            <button>বাংলা</button>
        </div>
    </div>

</div>

    <div class="login-container">

        

        <!-- App Name -->
        <h1><span class="hindi">मन</span><span class="english">Setu</span></h1>

        <p class="tagline">Your wellbeing, our bridge.</p>

        <!-- Logo -->
        <img src="../assets/logo1.png" class="logo" alt="MannSetu Logo">

        

        <h2><span class="english">Welcome back</span></h2>
        <!--<p class="subtitle">Login to continue your journey</p>-->

        <!-- Login Form -->
        <form>

            <div class="input-box">
                <span>♙</span>
                <input type="text" placeholder="phone number">
            </div>

            <div class="input-box">
                <span>♙</span>
                <input type="text" placeholder="Email (optional) ">
            </div>

            <div class="input-box">
                <span>🔒</span>
                <input type="password" placeholder="Password">
                <span class="eye">◉</span>
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="or">
            <span></span>
            <p>or</p>
            <span></span>
        </div>

        <button class="google">
            <b>G</b> Continue with Google
        </button>

        <p class="signup">
            Don't have an account?
            <a href="#">Sign up</a>
        </p>

    </div>

    <script src="login.js"></script>

</body>
</html>
